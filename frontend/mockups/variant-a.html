<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>변형 A — One UI Clean</title>
<style>
  :root{
    --primary:#0381FE;--primaryDark:#026AD6;--primaryTint:#E8F2FF;
    --bg:#F5F6F8;--surface:#FFF;--surfaceAlt:#F0F2F5;--border:#E3E6EB;
    --text:#1A1C1E;--sub:#5A6068;--muted:#8B9097;
    --success:#1FA463;--warning:#F2A20C;--danger:#E5484D;
    --successTint:#E6F6EE;--warningTint:#FDF3E0;--dangerTint:#FCEBEC;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{width:390px;background:var(--bg);font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;color:var(--text)}
  .wrap{min-height:844px;display:flex;flex-direction:column}
  .head{padding:18px 16px 8px}
  .brand{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  .h1{font-size:26px;font-weight:800;margin-top:2px}
  .toggle{display:flex;background:var(--surfaceAlt);border-radius:999px;padding:4px;margin-top:14px}
  .seg{flex:1;text-align:center;padding:9px;border-radius:999px;font-size:14px;font-weight:600;color:var(--sub)}
  .seg.on{background:var(--surface);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .body{flex:1;padding:8px 16px 0;overflow:hidden}
  .label{font-size:12px;color:var(--muted);font-weight:600;margin:14px 2px 8px}

  /* swipe deck */
  .deck{position:relative;height:184px;margin-top:6px}
  .deck .behind{position:absolute;left:14px;right:14px;top:14px;height:170px;background:var(--surface);border:1px solid var(--border);border-radius:20px;opacity:.55}
  .deck .behind2{left:7px;right:7px;top:7px;opacity:.8}
  .card{position:absolute;left:0;right:0;top:0;height:170px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(0,0,0,.07)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--warningTint);color:var(--warning)}
  .cardT{font-size:19px;font-weight:700;margin-top:12px}
  .cardD{font-size:14px;color:var(--sub);margin-top:6px;line-height:1.5}
  .cardCta{margin-top:14px;display:inline-block;background:var(--primary);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
  .dot{width:7px;height:7px;border-radius:4px;background:var(--border)}
  .dot.on{width:18px;background:var(--primary)}

  /* 2-col tiles */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
  .ti{width:34px;height:34px;border-radius:10px;background:var(--primaryTint);display:flex;align-items:center;justify-content:center;font-size:17px}
  .tt{font-size:14px;font-weight:700;margin-top:10px}
  .ts{font-size:12px;color:var(--muted);margin-top:2px}
  .tstat{font-size:12px;font-weight:700;margin-top:8px;color:var(--success)}
  .tstat.warn{color:var(--warning)}

  /* bottom chat bar */
  .chatbar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px 18px;display:flex;gap:8px;align-items:center}
  .cinput{flex:1;background:var(--surfaceAlt);border-radius:999px;padding:13px 18px;color:var(--muted);font-size:15px}
  .csend{width:44px;height:44px;border-radius:22px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
</style></head>
<body><div class="wrap">
  <div class="head">
    <div class="brand">SAMSUNG</div>
    <div class="h1">AI 컨시어지</div>
    <div class="toggle"><div class="seg on">홈</div><div class="seg">고객지원</div></div>
  </div>
  <div class="body">
    <div class="label">오늘의 브리핑</div>
    <div class="deck">
      <div class="behind"></div><div class="behind behind2"></div>
      <div class="card">
        <span class="badge">점검 필요</span>
        <div class="cardT">세탁기 배수 이상 (5C)</div>
        <div class="cardD">배수 필터 수명이 40%까지 줄었어요. 지금 청소·교체하면 5C 오류를 예방할 수 있어요.</div>
        <span class="cardCta">해결 방법 보기 →</span>
      </div>
    </div>
    <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>

    <div class="label">한눈에 보기</div>
    <div class="grid">
      <div class="tile"><div class="ti">🧺</div><div class="tt">세탁기</div><div class="ts">WF45T6000AW</div><div class="tstat warn">점검 필요</div></div>
      <div class="tile"><div class="ti">❄️</div><div class="tt">냉장고</div><div class="ts">RF85 정수필터</div><div class="tstat">정상</div></div>
      <div class="tile"><div class="ti">📦</div><div class="tt">부품 주문</div><div class="ts">배수 필터 ₩12,000</div><div class="tstat warn">주문 대기</div></div>
      <div class="tile"><div class="ti">🏠</div><div class="tt">방문 예약</div><div class="ts">출장 수리</div><div class="tstat">예약 가능</div></div>
    </div>
  </div>
  <div class="chatbar"><div class="cinput">가전 문제·부품 주문을 물어보세요</div><div class="csend">↑</div></div>
</div></body></html>
