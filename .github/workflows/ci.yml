name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r backend/requirements.txt
      - name: Run tests
        run: cd backend && python -m pytest

  bff:
    name: bff (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # bff tests import backend in-process, so backend deps are installed too.
      - name: Install dependencies
        run: pip install -r bff/requirements.txt -r bff/requirements-dev.txt -r backend/requirements.txt
      - name: Run tests
        run: cd bff && python -m pytest

  frontend:
    name: frontend (jest + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run jest
        run: cd frontend && npx jest
      - name: Vite build
        run: cd frontend && npx vite build

  # Blocking gate: ruff(backend/bff)·eslint(0 errors)·prettier(src) 모두 현재 코드에서 통과.
  lint:
    name: lint (ruff + eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend bff
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: ESLint
        run: cd frontend && npx eslint .
      - name: Prettier check
        run: cd frontend && npx prettier --check "src/**/*.{ts,tsx}"

  # 추가형(S9·ADR-0065) — 릴리스 스크립트가 실제로 도는지 빠르게 검증(기존 잡 동작 불변).
  release-dry-run:
    name: release dry-run (version stamp + DORA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 버전 스탬프·리드타임용 git 메타.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Version stamp (dev)
        run: |
          python scripts/release.py stamp --env dev --out build
          cat build/VERSION
      - name: DORA record + report (smoke)
        run: |
          python scripts/dora.py record deployment --env dev --sha "${{ github.sha }}" \
            --commit-date "$(git show -s --format=%cI HEAD)" --store build/dora-metrics.jsonl
          python scripts/dora.py report --store build/dora-metrics.jsonl
