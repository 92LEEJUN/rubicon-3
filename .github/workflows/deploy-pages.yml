name: Deploy FE to GitHub Pages

# FE(react-native-web) 정적 빌드를 GitHub Pages에 배포한다(무료·외부 접속).
# 최초 1회: 저장소 Settings → Pages → Source = "GitHub Actions" 로 설정 필요.
# 배포 URL: https://92leejun.github.io/rubicon-3/  (라이브 채팅은 ?screen=live&ws=<BFF> 필요)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          DEPLOY_BASE: /rubicon-3/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
