name: Deploy FE to GitHub Pages

# FE(react-native-web) 정적 빌드를 gh-pages 브랜치로 배포(클래식 방식).
# github-pages "환경(environment)"을 쓰지 않아 환경 보호 규칙/Actions 소스 이슈를 우회한다.
# 최초 1회: Settings → Pages → Source = "Deploy from a branch" → Branch: gh-pages /(root)
# 배포 URL: https://92leejun.github.io/rubicon-3/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # gh-pages 브랜치 푸시용

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          DEPLOY_BASE: /rubicon-3/
          VITE_APP_ENV: prd   # 환경 계층(ADR-0056) — 프로덕션 빌드 명시(미설정 시 MODE=production→prd 추론)
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          force_orphan: true   # gh-pages 히스토리 단순화
