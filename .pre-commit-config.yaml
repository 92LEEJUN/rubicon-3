# pre-commit 훅(gap 2) — 설치: `pip install pre-commit && pre-commit install`
# ruff는 backend/bff만 검사(설정은 각 pyproject.toml). 소스 일괄 리포맷은 하지 않는다(첫 패스).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        name: ruff (backend/bff)
        files: ^(backend|bff)/.*\.py$
        args: [--config, backend/pyproject.toml]
  # prettier는 레포 일괄 포매팅 전까지 advisory — 활성화는 후속(코드 일괄 정리 후).
