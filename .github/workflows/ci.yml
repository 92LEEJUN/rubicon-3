name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt -r backend/requirements.txt
      - name: Run tests
        run: cd backend && python -m pytest

  bff:
    name: bff (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # bff tests import backend in-process, so backend deps are installed too.
      - name: Install dependencies
        run: pip install -r bff/requirements.txt -r bff/requirements-dev.txt -r backend/requirements.txt
      - name: Run tests
        run: cd bff && python -m pytest

  frontend:
    name: frontend (jest + vite build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run jest
        run: cd frontend && npx jest
      - name: Vite build
        run: cd frontend && npx vite build

  # Lint job is informative (non-blocking) for this first pass: the ruff/eslint/
  # prettier configs land in parallel from other agents. Once the codebase is
  # clean and configs are in place, remove `continue-on-error` to make it blocking.
  lint:
    name: lint (ruff + eslint + prettier)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend bff
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: ESLint
        run: cd frontend && npx eslint .
      - name: Prettier check
        run: cd frontend && npx prettier --check "src/**/*.{ts,tsx}"
