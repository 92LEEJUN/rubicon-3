# 3계층(FE↔BFF↔BE) 로컬 컨테이너 오케스트레이션 (docs/architecture.md §9)
#
# - be:  도메인·오케스트레이터 내부 API (FastAPI, 8001)
# - bff: 클라이언트 표면 게이트웨이 (FastAPI, 8000). BE_BASE_URL로 be를 HTTP 중계.
# - fe:  RN(Web) 정적 빌드 (nginx, 컨테이너 80 → 호스트 5173).
#
# 접속:
#   - FE   → http://localhost:5173
#   - BFF  → http://localhost:8000
#   - BE   → http://localhost:8001 (직접 접근은 디버그용; FE는 BFF만 본다)
#
# FE는 빌드 타임에 BFF 주소를 박지 않는다. 브라우저가 query param으로 주입한다:
#   http://localhost:5173/?api=http://localhost:8000&ws=ws://localhost:8000
# (FE는 BFF만 호출 — api-contract §2. be로는 직접 접근하지 않는다.)
services:
  be:
    build: ./backend
    ports:
      - "8001:8001"

  bff:
    build: ./bff
    ports:
      - "8000:8000"
    environment:
      # BFF는 be를 import하지 않고 이 주소로 HTTP 중계한다.
      BE_BASE_URL: http://be:8001
    depends_on:
      - be

  fe:
    build: ./frontend
    ports:
      # nginx(컨테이너 80) → 호스트 5173
      - "5173:80"
    depends_on:
      - bff
